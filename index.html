<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f2ea" />
    <meta name="description" content="一起挑选下一家想去的餐厅" />
    <title>下一餐 · 餐厅选择</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section id="picker-screen" class="screen picker-screen" aria-label="餐厅选择">
        <header class="topbar">
          <div>
            <p class="eyebrow">WHERE TO EAT</p>
            <h1>下一餐</h1>
          </div>
          <div class="progress-wrap" aria-label="选择进度">
            <span id="progress-text">1 / 1</span>
            <div class="progress-track"><i id="progress-bar"></i></div>
          </div>
        </header>

        <section class="review-bar" aria-labelledby="review-title">
          <div class="review-heading">
            <h2 id="review-title">已选回顾</h2>
            <span id="review-count">0 项</span>
          </div>
          <div id="review-list" class="review-list" aria-live="polite">
            <span class="review-empty">选择后会显示在这里</span>
          </div>
        </section>

        <div class="card-stage">
          <article id="restaurant-card" class="restaurant-card">
            <div id="restaurant-image" class="restaurant-image" role="img">
              <button id="back-button" class="icon-button back-button" type="button" aria-label="返回上一家">
                <span aria-hidden="true">←</span>
                <span class="back-label">重新选择上一家</span>
              </button>
              <div class="image-shade"></div>
              <div class="image-copy">
                <div id="restaurant-number" class="restaurant-number">01</div>
                <p id="restaurant-category" class="category">创意料理</p>
                <h2 id="restaurant-name">餐厅名称</h2>
                <p id="restaurant-location" class="location"></p>
              </div>
            </div>

            <div class="restaurant-info">
              <section class="info-section dish-section" aria-labelledby="dish-heading">
                <div class="section-heading">
                  <span class="section-index">01</span>
                  <h3 id="dish-heading">推荐菜</h3>
                </div>
                <div id="dish-grid" class="dish-grid"></div>
              </section>

              <section class="info-section dianping-section" aria-labelledby="dianping-heading">
                <div class="section-heading compact-heading">
                  <span class="section-index">02</span>
                  <h3 id="dianping-heading">大众点评</h3>
                </div>
                <a id="dianping-link" class="dianping-link" target="_blank" rel="noopener noreferrer">
                  <span class="dianping-mark" aria-hidden="true">点</span>
                  <span class="dianping-copy">
                    <strong>查看餐厅详情</strong>
                    <small>菜单、营业时间与真实评价</small>
                  </span>
                  <span class="link-arrow" aria-hidden="true">↗</span>
                </a>
              </section>

              <section class="info-section rating-section" aria-labelledby="rating-heading">
                <div class="section-heading compact-heading">
                  <span class="section-index">03</span>
                  <h3 id="rating-heading">我的评分</h3>
                </div>
                <div class="ratings-layout">
                  <div id="standard-ratings" class="standard-ratings"></div>
                  <div id="ebao-rating" class="ebao-rating"></div>
                </div>
              </section>
            </div>
          </article>
        </div>

        <div class="decision-area">
          <p class="decision-hint">你想和我一起去吗？</p>
          <div class="decision-buttons">
            <button class="decision-button no" type="button" data-choice="no" aria-label="不想去">
              <span class="symbol" aria-hidden="true">×</span>
            </button>
            <button class="decision-button maybe" type="button" data-choice="maybe" aria-label="待定">
              <span class="symbol" aria-hidden="true">?</span>
            </button>
            <button class="decision-button yes" type="button" data-choice="yes" aria-label="想去">
              <span class="symbol" aria-hidden="true">✓</span>
            </button>
          </div>
        </div>
      </section>

      <section id="final-screen" class="screen final-screen" hidden aria-label="确认最终餐厅">
        <header class="final-header">
          <p class="eyebrow">ONE LAST PICK</p>
          <h1>最终去哪家？</h1>
          <p>从喜欢和待定的餐厅中，确认这次的最终选择。</p>
        </header>
        <div id="final-candidates" class="final-candidates"></div>
        <button id="return-to-picker" class="text-button return-button" type="button">返回修改上一轮选择</button>
      </section>

      <section id="result-screen" class="screen result-screen" hidden aria-label="选择结果">
        <header class="result-header">
          <p class="eyebrow">ALL DONE</p>
          <h1 id="result-title">选择完成</h1>
          <p>长按下方图片保存，然后直接发给我吧。</p>
        </header>

        <div class="poster-frame">
          <div id="poster-loading" class="poster-loading">正在生成结果图…</div>
          <img id="result-poster" alt="本次餐厅选择结果图" />
        </div>

        <div class="result-actions">
          <button id="share-button" class="primary-button" type="button">分享结果图</button>
          <a id="download-button" class="secondary-button" download="我的餐厅选择.png">保存到手机</a>
          <button id="restart-button" class="text-button" type="button">重新选择</button>
        </div>
        <p id="share-tip" class="share-tip" aria-live="polite"></p>
      </section>
    </main>

    <canvas id="poster-canvas" width="1080" height="1920" hidden></canvas>
    <script src="restaurants.js"></script>
    <script src="script.js"></script>
  </body>
</html>
